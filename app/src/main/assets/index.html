<style>

html,body{height:100%;background:var(--bg);overscroll-behavior:none}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--tx);font-size:14px;line-height:1.5}

#app{width:100%;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:700px){#app{max-width:480px}}
#main{flex:1;overflow-y:auto;padding:24px 20px 24px}
h1{font-size:28px;font-weight:700;line-height:1.2}
h2{font-size:20px;font-weight:600;line-height:1.3}
.row{display:flex;align-items:center;justify-content:space-between}
.meta{font-size:12px;color:var(--tx2)}
.ic{width:48px;height:48px;display:grid;place-items:center}
svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.li{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-bottom:1px solid var(--dv);width:100%;text-align:left}
.empty{margin-top:72px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.seg{display:flex;background:var(--sf);border-radius:999px;margin-top:16px}

.seg button[aria-pressed=true]{background:var(--ac);color:var(--inv)}

.sh>div{background:var(--sf);width:100%;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto;display:flex;flex-direction:column;gap:16px}
input[type=text]{height:48px;border:1px solid var(--dv);border-radius:14px;padding:0 16px;background:var(--sf);color:var(--tx);font:inherit;font-size:16px;width:100%}
label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
.ck{display:flex;gap:12px;align-items:center;min-height:48px;width:100%;text-align:left}
.ck b{width:20px;height:20px;border:1.5px solid var(--dis);border-radius:3px;display:grid;place-items:center;flex:none}
.ck[aria-checked=true] b{background:var(--ac);border-color:var(--ac);color:var(--inv)}
.rd{position:absolute;inset:0;z-index:4;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rd.dk{--bg:#111;--tx:#F5F4EE;--tx2:#A8A690;--dv:#33332F;--ac:#F5F4EE;--inv:#111;--hl:#E8935E}
.rb{position:absolute;top:0;left:0;right:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 8px 0;border-bottom:1px solid var(--dv);transition:transform .2s}
.rd.hide .rb{transform:translateY(-110%)}.rd.hide .rf{transform:translateY(110%)}
.rs{flex:1;overflow-y:auto;padding:12px 12px 80px;position:relative}.pgw{margin-bottom:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}.rd.dk .pgw{background:#121212;box-shadow:none}.pgw canvas{display:block;width:100%}
.rs h2{font-family:Georgia,serif;font-size:26px;margin-bottom:24px;font-weight:700}
.rs p{font-size:18px;line-height:1.65;margin-bottom:20px}
.rf{display:flex;align-items:center;gap:12px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));transition:transform .2s;position:absolute;bottom:0;left:0;right:0;z-index:3;background:var(--bg)}
body{touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}#main{overscroll-behavior:contain}.pgw{contain:layout paint}:root{--ok:#4F7D5B;--co:#CC5A3A}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#8CC59A;--co:#F0866A}}:root[data-theme="dark"]{--ok:#8CC59A;--co:#F0866A}.th .cv{font-size:5px;padding:3px;box-shadow:none;border-radius:3px}@keyframes in{from{opacity:0;transform:translateY(8px)}}@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(24px)}}@keyframes sl{from{transform:translateY(40px)}}@keyframes grow{from{width:0}}
.enter{animation:in .22s ease-out}.rd.anim{animation:up .25s ease-out}.sh.anim{animation:fade .18s ease-out}.sh.anim>div{animation:sl .22s ease-out}#ts{animation:fade .15s}.bar i{animation:grow .5s ease-out}.rf .bar i{animation:none}
.grid>button,.li,.btn,.btn2,nav button,.ic{transition:transform .12s ease,opacity .15s}.grid>button:active,.btn:active,.btn2:active{transform:scale(.97)}.li:active,nav button:active{opacity:.6}.ic:active{opacity:.5}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.native #app{height:100%;padding-top:0}.native nav{padding-bottom:8px}.native .rd{padding-top:0}.native .rb{padding-top:0}.native .rf{padding-bottom:12px}
</style></head>

if(shelf==='all'){return '<div class="row"><button class="ic" data-a="lib" aria-label="Back">'+ic('back')+'</button></div><h1 style="margin-top:8px">All books</h1><div class="meta" style="margin-top:4px">Deleting a book removes it from every shelf.</div><div style="margin-top:16px;border-top:1px solid var(--dv)">'+(S.books.length?sorted().map(function(b){return row(b,'dbk','Delete')}).join(''):'<p class="meta" style="padding:16px 0">No books yet.</p>')+'</div><button class="btn" style="margin-top:24px" data-a="imp">'+ic('plus',20)+' Add a PDF</button>'}
if(shelf){var s=S.shelves.filter(function(x){return x.id===shelf})[0],bs=s.ids.map(bk);
return '<div class="row"><button class="ic" data-a="lib" aria-label="Back">'+ic('back')+'</button><button class="btn2" style="height:40px;font-size:14px" data-a="rename">Rename</button></div><h1 style="margin-top:8px">'+s.name+'</h1><div class="meta" style="margin-top:4px">'+bs.length+' book'+(bs.length==1?'':'s')+'</div><div style="margin-top:16px;border-top:1px solid var(--dv)">'+(bs.length?bs.map(function(b){return row(b,'rmb','Remove from shelf:')}).join(''):'<p class="meta" style="padding:16px 0">This shelf is empty.</p>')+'</div><div style="display:flex;gap:12px;margin-top:24px"><button class="btn" data-a="addb">'+ic('plus',20)+' Add books</button><button class="btn2" data-a="del">Delete shelf</button></div>'}
var o='<div class="row"><h1>Library</h1><button class="ic" data-a="new" aria-label="Create a bookshelf">'+ic('plus')+'</button></div>';
if(!S.shelves.length)return o+'<div class="empty">'+ILL+'<h2 style="margin-top:24px">Your library, your way.</h2><p style="color:var(--tx2);max-width:240px">Create your first bookshelf to organise your books.</p><button class="btn" style="margin-top:20px;height:52px" data-a="new">'+ic('plus',20)+' Create a bookshelf</button></div>'+(S.books.length?'<div style="margin-top:40px;border-top:1px solid var(--dv)">'+allrow()+bmrow()+'</div>':'');
return o+'<div style="margin-top:16px;border-top:1px solid var(--dv)">'+allrow()+bmrow()+S.shelves.map(function(s){return '<button class="li" data-a="shelf" data-id="'+s.id+'"><span><span style="font-size:16px;font-weight:500">'+s.name+'</span><br><span class="meta">'+s.ids.length+' book'+(s.ids.length==1?'':'s')+'</span></span><span class="meta">\u203a</span></button>'}).join('')+'</div>'}
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function streak(){var ds=S.st.days,n=0,d=new Date();if(ds.indexOf(dkey(d))<0)d.setDate(d.getDate()-1);while(ds.indexOf(dkey(d))>-1){n++;d.setDate(d.getDate()-1)}return n}
function stat(v,l,col){return '<div style="flex:1;background:var(--sf);border-radius:16px;padding:16px 8px;text-align:center"><div style="font-size:26px;font-weight:700;line-height:1.2;color:'+col+'">'+v+'</div><div class="meta" style="margin-top:2px">'+l+'</div></div>'}
function stats(){var done=S.books.filter(function(b){return b.p>0&&b.pg>=b.p}).length;return '<h2 style="margin-top:32px;font-size:18px">Reading statistics</h2><div style="display:flex;gap:12px;margin-top:16px">'+stat((S.st.sec/3600).toFixed(1),'Hours read','var(--hl)')+stat(done,'Completed','var(--ok)')+'</div>'}
S.st=S.st||{sec:0,days:[]};S.books.forEach(function(b){b.t=b.t.replace(/_/g,' ');b.bms=b.bms||[]});
setInterval(function(){if(rd&&!document.hidden){S.st.sec+=5;var t=dkey(new Date());if(S.st.days.indexOf(t)<0)S.st.days.push(t);save()}},5000);
function vSet(){return '<h1>Settings</h1><h2 style="margin-top:32px;font-size:18px">Appearance</h2><div class="meta">Choose how Shelf looks.</div><div class="seg" role="group" aria-label="Appearance">'+['light','dark','system'].map(function(t){return '<button data-a="theme" data-id="'+t+'" aria-pressed="'+(S.theme===t)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join('')+'</div>'+stats()+'<div style="border-top:1px solid var(--dv);margin-top:24px;padding-top:16px;display:flex;gap:16px;align-items:center"><span style="color:var(--tx2)">'+ic('info')+'</span><span><b style="font-weight:600">Shelf</b><br><span class="meta">Version 1.3.1</span></span></div>'}
function vSheet(){if(!sheet)return '';var h;
if(sheet.t==='cf'){h='<h2>'+sheet.m+'</h2><div style="display:flex;gap:12px"><button class="btn" style="flex:1" data-a="yes">'+(sheet.b||'Remove')+'</button><button class="btn2" data-a="x">Cancel</button></div>'}else if(sheet.t==='add'){var s=S.shelves.filter(function(x){return x.id===shelf})[0];h='<h2>Add books</h2>'+S.books.map(function(b){var on=s.ids.indexOf(b.id)>-1;return '<button class="ck" role="checkbox" aria-checked="'+on+'" data-a="tg" data-id="'+b.id+'"><b>'+(on?ic('chk',14):'')+'</b>'+b.t+'</button>'}).join('')+'<button class="btn2" style="display:inline-flex;align-items:center;justify-content:center;gap:8px" data-a="impS">'+ic('plus',18)+' Import new PDF</button><button class="btn" data-a="x">Done</button>'}
else{var nm=sheet.t==='ren'?S.shelves.filter(function(x){return x.id===shelf})[0].name:'';return '<div class="rd" style="z-index:6"><header class="rb" style="border:0"><button class="ic" data-a="x" aria-label="Back">'+ic('back')+'</button><span style="font-weight:600;font-size:16px;margin-right:auto">'+(nm?'Rename Shelf':'Create Shelf')+'</span></header><div style="flex:1;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow:auto">'+ILL+'<h2 style="font-family:Georgia,serif;font-weight:500;margin:16px 0 8px">Name your bookshelf</h2><input id="nm" type="text" maxlength="40" aria-label="Bookshelf name" value="'+nm+'" placeholder="e.g. Fiction, Self-Help…"><button class="btn" style="width:100%;height:52px" data-a="ok">'+(nm?'Save':'Create')+'</button></div></div>'}
return '<div class="sh"><div role="dialog" aria-modal="true">'+h+'</div></div>'}
var TXT=['Reading is a quiet kind of travel. You sit still, and the world rearranges itself around the page in front of you.','A good reading space does very little. It keeps the light even, the margins wide and the interface out of the way, so the words can do their work.','Progress is easiest to trust when it is small and honest: one thin line, one number, and the place you stopped remembered without being asked.','Some evenings you read for an hour; some evenings for a single page. Both count, and the shelf keeps the same record of each.','When the screen dims, the text should soften with it. Light type on a dark surface, images left as they were, and nothing glaring at the edge of your attention.','Keep going. The next page is already waiting exactly where you left it.'];
function vRd(){var b=rd,d=S.rdark;return '<div class="rd hide'+(d?' dk':'')+'" id="rd"><header class="rb"><button class="ic" data-a="close" aria-label="Back to books">'+ic('back')+'</button><span style="font-weight:500;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+b.t+'</span><span style="display:flex"><button class="ic" data-a="rdark" aria-label="Toggle dark reading" style="color:'+(d?'var(--hl)':'inherit')+'">'+ic('moon')+'</button><button class="ic" id="bmb" data-a="bm" aria-label="Bookmark this page"></button><button class="ic" data-a="bml" aria-label="Bookmarks">'+ic('more')+'</button></span></header><div class="rs" id="sc" data-a="tap"><div id="pgs"></div></div><footer class="rf"><span class="meta" id="pn"></span><div class="bar"><i id="pb"></i></div><span class="meta" id="pp"></span></footer></div>'}
function upd(){var b=rd;document.getElementById('pn').textContent=b.pg+' / '+b.p;document.getElementById('pb').style.width=pct(b)+'%';document.getElementById('pp').textContent=pct(b)+'%';var on=(b.bms||[]).indexOf(b.pg)>-1,e=document.getElementById('bmb');if(e){e.style.color=on?'var(--hl)':'inherit';e.innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" style="fill:'+(on?'currentColor':'none')+'">'+I.bm+'</svg>'}}
if(window.Android)document.documentElement.classList.add('native');
function sysFs(on){try{if(window.Android&&Android.setFullscreen)Android.setFullscreen(on)}catch(e){}}
function tc(){var c=(rd&&S.rdark)?'#111111':(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#FAFAF8');if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];var m=document.querySelector('meta[name=theme-color]');if(m)m.content=c;try{if(window.Android&&Android.setBars){var n=parseInt(c.slice(1),16),l=((n>>16&255)*299+(n>>8&255)*587+(n&255)*114)/1000>140;Android.setBars(c,l)}}catch(e){}}
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",tc)}catch(e){}
var lastKey,shownSheet=false;
function draw(){applyTheme();tc();var m=document.getElementById('main');
m.innerHTML=tab==='books'?vBooks():tab==='library'?vLib():vSet();var key=tab+'|'+shelf;if(key!==lastKey){m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');lastKey=key}
var n=document.getElementById('nav');n.style.display=rd?'none':'flex';
n.innerHTML=[['books','Books','books'],['library','Library','lib'],['settings','Settings','set']].map(function(x){return '<button data-a="tab" data-id="'+x[0]+'"'+(tab===x[0]?' aria-current="page"':'')+'>'+ic(x[2])+x[1]+'</button>'}).join('');
var ov=document.getElementById('ov');ov.innerHTML=rd?'':vSheet();if(sheet&&!rd&&ov.firstChild&&!shownSheet)ov.firstChild.classList.add('anim');shownSheet=!!sheet;
if(rd){ov.innerHTML=vRd();ov.firstChild.classList.add('anim');startReader();sysFs(true)}
else if(sheet){var i=document.getElementById('nm');if(i)i.focus()}}
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,id=el.dataset.id;
if(a==='tab'){tab=id;shelf=null}
else if(a==='open'){rd=bk(id);rd.at=Date.now();if(rd.pg<1)rd.pg=1}
else if(a==='close'){sysFs(false);save();if(obs)obs.disconnect();if(RD)RD.destroy();RD=null;obs=null;rd=null;if(document.fullscreenElement)document.exitFullscreen()}
else if(a==='tap'){var rr=document.getElementById('rd');rr.classList.toggle('hide');sysFs(rr.classList.contains('hide'));return}
else if(a==='fs'){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(x){}document.getElementById('rd').classList.add('hide');sysFs(true);return}
else if(a==='rdark'){S.rdark=!S.rdark;save();var r=document.getElementById('rd');r.classList.toggle('dk',S.rdark);rerender();tc();el.style.color=S.rdark?'var(--ac)':'inherit';return}
else if(a==='bm'){var bs=rd.bms=rd.bms||[],k=bs.indexOf(rd.pg);if(k>-1)bs.splice(k,1);else{bs.push(rd.pg);bs.sort(function(x,y){return x-y})}save();upd();toast(k>-1?'Bookmark removed':'Page '+rd.pg+' bookmarked');setTimeout(function(){toast('')},1200);return}
else if(a==='bml'){bmPanel();return}
else if(a==='bmx'){var q=document.getElementById('bmp');if(q)q.remove();return}
else if(a==='bmgo'){var q2=document.getElementById('bmp');if(q2)q2.remove();goPage(+id);return}
else if(a==='bmdel'){rd.bms=rd.bms.filter(function(x){return x!==+id});save();upd();bmPanel();return}
else if(a==='bmopen'){rd=bk(id);rd.pg=+el.dataset.p;rd.at=Date.now()}
else if(a==='bms')shelf='bms';
else if(a==='theme'){S.theme=id;save()}
else if(a==='new')sheet={t:'new'};
else if(a==='rename')sheet={t:'ren'};
else if(a==='addb')sheet={t:'add'};
else if(a==='x')sheet=null;
else if(a==='lib')shelf=null;
else if(a==='shelf')shelf=+id;
else if(a==='del')ask('Delete this shelf? Your books are kept.','Delete',function(){S.shelves=S.shelves.filter(function(x){return x.id!==shelf});shelf=null;save()});
else if(a==='yes'){var f=sheet.fn;sheet=null;f()}
else if(a==='imp'){impTarget=null;document.getElementById('fi').click();return}
else if(a==='impS'){impTarget=shelf;document.getElementById('fi').click();return}
else if(a==='all')shelf='all';
else if(a==='rmb'){var sh2=S.shelves.filter(function(x){return x.id===shelf})[0];sh2.ids=sh2.ids.filter(function(i){return i!==+id});save()}
else if(a==='dbk'){var bb=bk(id);ask('Delete \u201c'+bb.t+'\u201d? The PDF is removed from this device.','Delete',function(){var k=bb.id;S.books=S.books.filter(function(x){return x.id!==k});S.shelves.forEach(function(sh){sh.ids=sh.ids.filter(function(i){return i!==k})});delete COV[k];idbDel(k).catch(function(){});save()})}
else if(a==='tg'){var s2=S.shelves.filter(function(x){return x.id===shelf})[0],k=s2.ids.indexOf(+id);if(k>-1)s2.ids.splice(k,1);else s2.ids.push(+id);save()}
else if(a==='ok'){var v=document.getElementById('nm').value.trim();if(!v)return;
if(sheet.t==='ren')S.shelves.filter(function(x){return x.id===shelf})[0].name=v;else S.shelves.push({id:Date.now(),name:v,ids:[]});sheet=null;save()}
draw()});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='nm')document.querySelector('[data-a=ok]').click()});
draw();
Promise.all(S.books.map(function(b){return idbGet(b.id).then(function(r){if(r&&r.cover)COV[b.id]=r.cover}).catch(function(){})})).then(function(){if(!rd&&!sheet)draw()});
window.__back=function(){var p=document.getElementById('bmp');if(p){p.remove();return true}if(sheet){sheet=null;draw();return true}if(rd){var b=document.querySelector('[data-a=close]');if(b){b.click();return true}}if(shelf){shelf=null;draw();return true}if(tab!=='books'){tab='books';draw();return true}return false};
</script></body></html>
